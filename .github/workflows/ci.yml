name: fray CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # llvmlite is still installed, and only bootstrap/codegen.py needs it: it
      # builds the first native compiler's IR through llvmlite's IR builder.
      # Everything else — the release chain, the driver, the gates — emits
      # objects with `llc` now, and llvmlite's LLVM *binding* is gone from the
      # tree entirely. This line goes away when that builder becomes text
      # emission; until then, dropping it breaks Stage 1 outright, because the
      # import is at module scope and the v1 build needs it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite

      # The release chain turns IR into objects with LLVM's own `llc`, so CI
      # installs it too. Without llc, `--backend auto` silently uses the
      # llvmlite backend instead and the suite stops testing the emitter that
      # actually ships: the stage2 fixed-point byte-identity check degrades to a
      # note whenever llvmlite, not llc, produced the objects. llvm-22 comes
      # from apt.llvm.org (Ubuntu's own repositories stop well short of it) and
      # is the same major version llvmlite bundles, so the bootstrap and the
      # emitter agree on the pointer dialect instead of meeting across a gap.
      - name: Install C toolchain and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc wget gnupg
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22

      # The library is described by two lists — runtime/Makefile's
      # RUNTIME_SOURCES and bootstrap/codegen.py's — and a translation unit
      # added to one of them links in some builds and not others. This fails
      # when a runtime/*.c is missing from either list, when a list names a
      # file that does not exist, or when a program (a .c with main) is
      # listed as a library unit.
      - name: Runtime source lists agree (every translation unit is built)
        run: python tools/check_runtime_sources.py

      # runtime.h is the contract between the runtime library and everything
      # that links against it, so it is worth only as much as it is true. This
      # compiles the library's translation units — the same RUNTIME_SOURCES
      # list the step above validates — reads their symbols with nm, and then
      # fails on a non-inline fray_* declaration no unit defines (a prototype
      # the linker can only reject at somebody's first call — thirteen had
      # accumulated) or on a file-scope fray_* definition the header never
      # declares (API that leaked out of its translation unit). `static`
      # functions stay private and the header's `static inline` helpers are
      # definitions, so both are exempt. Finally, the other end of the same
      # contract: every runtime entry point the two emitters call has to exist
      # in the library, and every literal call in the bootstrap has to be one
      # its RUNTIME_FUNCS declares — a rename there is otherwise invisible
      # until a program fails to link.
      - name: Runtime header, runtime library and emitters agree
        run: python tools/check_runtime_symbols.py

      - name: Runtime C tests (memory management, threads, coroutines)
        run: |
          make -C runtime clean
          make -C runtime test

      - name: Compiler unit tests (inference)
        run: python bootstrap/tests/test_inference.py

      - name: Run test suite (oracle + compiled e2e)
        run: python tools/run_tests.py -v

      # The self-hosted compiler (compiler/*.fray) implements a subset of the
      # language, and that subset must stay honest: it always terminates, it
      # reports syntax it cannot compile as a diagnostic naming the stage and
      # position, and the programs it does compile match their .expected
      # output. The original defect this gate was built for was a parser that
      # spun forever on `struct` fields with defaults.
      - name: Self-hosted frontend gate (no hangs, honest diagnostics, coverage)
        run: |
          python tools/check_frontend.py --probes
          python tools/check_frontend.py --run

      # Stage 1 of self-hosting: the self-hosted compiler compiles its own four
      # modules to IR that LLVM verifies, builds and runs them, and — where a
      # driver exists in tests/selfhost/ — executes the compiled module and
      # compares its output with the oracle's. This is the check that keeps
      # "it compiles itself" true instead of a one-off measurement.
      - name: Self-hosted compiler compiles itself (Stage 1)
        run: python tools/check_frontend.py --stage1

      # The compiler modules define the same top-level names (`get_errors`,
      # `clear_errors`, `node_type`, `node_get`, and the private `errors`
      # list), so building each one separately never proves they can coexist.
      # compiler/main.fray imports them all, and the self-hosted compiler's
      # linker resolves the imports and renames the collisions itself — no
      # host-side amalgamation. This builds, links and runs that program as
      # ONE binary and diffs its output against the oracle.
      - name: Self-hosted compiler as one binary (native imports)
        run: python tools/check_frontend.py --single-unit

      # Stage 2 is where the release criterion actually lives: the compiler
      # compiles itself, and the two builds must agree twice — on the IR they
      # emit for frayc.fray, and on the binaries those IRs become. The second
      # comparison is the one that needs `llc`: when the llvmlite backend emits
      # the objects instead, the binaries are not comparable byte-for-byte and
      # the check degrades to a note. So this step is only worth running
      # because of the LLVM install above — and it was missing here entirely,
      # which meant CI asserted the fixed point on IR alone while the release
      # chain's own output went uncompared.
      - name: Self-hosted compiler rebuilds itself (Stage 2 fixed point)
        run: python tools/check_frontend.py --stage2

      # Module paths may be dotted: `import a.b` is a/b.fray under the program's
      # root, and `a.b.f()` / `from a.b import c` resolve through it. This
      # builds a two-package program whose packages share a function name, so a
      # wrong namespace prefix would produce the wrong value.
      - name: Package imports (dotted module paths)
        run: python tools/check_frontend.py --packages

      # The prose is a build artifact too. Both the syntax reference and the
      # tutorial promise that their snippets work, and for a long time nothing
      # compiled either document. The tutorial audit was written after 13 of its
      # 45 snippets turned out not to compile, run, or print what the document
      # said — nine of them because the tutorial described constructs the
      # language does not have. Each audit compiles and runs every snippet with
      # the native chain and diffs the output against the oracle, so a snippet
      # that stops working fails the build instead of misleading a reader. A
      # snippet that genuinely cannot work carries a record in the audit, and
      # the record is re-checked on every run, so it cannot outlive its reason.
      #
      # These audits need the native driver, which no step above leaves in the
      # tree, so build it here. Two details are load-bearing. The first is
      # --timeout 900: compiling the compiler takes longer than the 120s
      # default, so the default reports a non-termination that is really just
      # a slow build. The second is the backend, which is `llc` (installed
      # above) rather than the llvmlite fallback this step used to take.
      # `--backend auto` is strict now — IR that llc rejects fails the step
      # instead of being quietly re-checked against a different LLVM, which is
      # a different answer to the question rather than the same one.
      - name: Document audits (syntax reference, tutorial, block scope)
        run: |
          python tools/frayc_selfhosted.py build compiler/frayc.fray \
            -o build/frayc_driver --timeout 900
          python tools/check_fray_txt.py
          python tools/check_tutorial.py
          python tools/check_scope.py

      - name: Check grammar + semantics docs exist
        run: |
          test -f spec/grammar.md
          test -f spec/semantics.md
          echo "Spec docs present."

  memory:
    # Compiled programs under AddressSanitizer. The runtime owns a program's
    # memory (refcounting, GC, threads, coroutines), so a leak there scales
    # with the workload: a per-element leak is megabytes, a per-program leak
    # is one box. Runs one Python version — this gate is about the runtime
    # and the emitted code, not the toolchain matrix.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite

      # Same LLVM as the test job, and for the same reason: this gate compiles
      # through the host driver, so with only the llvmlite backend available it
      # would measure emitted code from a compiler the release never ships.
      #
      # valgrind as well, for the other half of the memory gate: ASan cannot
      # see a cross-thread lifetime bug in this runtime (the window is a
      # couple of instructions wide and never interleaves at native speed --
      # measured 0 reports in 240 runs across six ASAN_OPTIONS settings), so
      # the concurrent programs are memchecked too. Linux only, which is where
      # this job already is.
      - name: Install C toolchain, LLVM and valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc wget gnupg valgrind
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22

      - name: C runtime under AddressSanitizer
        run: make -C runtime asan

      - name: Leak and memory-error check (benchmarks + golden cases)
        run: python tools/check_memory.py --all --keep-going --valgrind

  benchmarks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite

      # The benchmarks compile real programs, and since the object emitter is
      # LLVM's own `llc` rather than a language binding, compiling one with
      # LLVM absent fails outright — there is no second backend left to fall
      # back to. That is what kept this job red after the llvmlite removal: the
      # two other jobs install llvm-22 for exactly this reason and this one
      # still installed only gcc, so run_benchmarks.py could not link a single
      # benchmark. Same version, same apt.llvm.org repository as the others.
      - name: Install C toolchain and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc wget gnupg
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22

      - name: Run benchmarks and check for regressions
        run: |
          python benchmarks/run_benchmarks.py \
            --baseline benchmarks/baseline-ci.json

      # The absolute-time check compares seconds against seconds, so its
      # baseline has to come from the machine doing the measuring.
      # benchmarks/baseline.json holds numbers from a 12-core workstation, and
      # diffing a shared 2-core runner against those failed on unchanged code —
      # pinning one benchmark to a single core was enough to trip it
      # (parallel_sum 0.004s -> 0.010s) — so this job keeps its own baseline.
      # Present: the same >25% and >5ms rule applies, against runner-measured
      # numbers. Absent: the run seeds the file and says it compared nothing,
      # and the step below prints the file so it can be committed.
      - name: CI baseline (commit this to make the check bite)
        run: cat benchmarks/baseline-ci.json

      # Compiled-vs-CPython gate. Every benchmark now clears CPython on
      # Linux (see plan.md Phase 5), so this is a real gate again — with a
      # 1.25x tolerance, because runner timing is noisy and `list_sum`
      # clears its bar by ~10-15%.
      #
      # It compares medians, not minima. The two sides are timed interleaved
      # so both see the same machine state, and the minimum of a few runs is
      # the statistic a single lucky run moves most. Comparing minima is what
      # produced the 1.33x red: CPython drew 0.079s on one run against
      # compiled's normal 0.105s, with nothing wrong in either program.
      # The tolerance is unchanged; only the statistic it is applied to is.
      - name: Compiled vs CPython
        run: |
          python - <<'EOF'
          import json, sys

          TOLERANCE = 1.25
          failed = False

          data = json.load(open("benchmarks/baseline-ci.json"))
          for name, res in data.items():
              if "error" in res:
                  raise SystemExit(f"{name}: benchmark error: {res['error']}")
              cmp_t = res.get("compiled_median", res["compiled_best"])
              cpy = res.get("cpython_median") or res.get("cpython_best")
              if not cpy:
                  print(f"{name}: compiled {cmp_t:.3f}s (no CPython bar)")
                  continue
              ratio = cmp_t / cpy
              verdict = "beats" if ratio <= 1.0 else "trails"
              print(f"{name}: compiled {cmp_t:.3f}s "
                    f"{verdict} CPython {cpy:.3f}s ({ratio:.2f}x)")
              if ratio > TOLERANCE:
                  failed = True
                  print(f"  ^ exceeds {TOLERANCE}x tolerance", file=sys.stderr)
          if failed:
              raise SystemExit("compiled code trails CPython beyond tolerance")
          EOF

  # The release packaging script has a macOS and a Windows branch, and both
  # were written without ever being run: package_release.sh detected those
  # platforms and produced tar.gz and zip accordingly, but nothing proved the
  # package built there is one a user can actually run. This job builds the
  # compiler from source and extracts the result on each platform, then runs
  # the package's own acceptance test from inside the extracted archive.
  #
  # Only packaging is exercised. The test, memory and benchmark jobs stay on
  # Linux: the memory gate is AddressSanitizer, and the benchmark gate compares
  # wall-clock against a baseline captured on Linux, neither of which transfers
  # to another runner. `shell: bash` throughout, because package_release.sh is
  # a bash script and on Windows it runs under Git Bash, where `uname -s`
  # reports MINGW64_NT and takes the branch it always meant to.
  # Only ubuntu-latest is a release gate. v0.1.0 ships Linux x86-64 and the
  # macOS and Windows legs are unproven: the compiler build fails on the macOS
  # SDK and the Windows runner cannot find `llc` after installing it. They
  # still run and still report, so the day either is fixed it says so -- but
  # they do not fail the build while they are known-broken, which would make
  # every run red and hide real regressions in the Linux leg.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install llvmlite (Stage 0/1 only)
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc wget gnupg
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y llvm-22

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install LLVM and GCC (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --no-progress -y
          choco install mingw --no-progress -y
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      # What the compiler needs is a C compiler and llc; the test above only
      # asserts each exists on PATH. Name them here so a runner image change
      # fails with a message about the missing tool rather than a compiler
      # error three steps later.
      # This runs after the install steps, so $GITHUB_PATH has taken effect by
      # now — an `llc --version` inside the install step itself would not, and
      # on Linux the tool is only ever named llc-22. The probe order mirrors
      # bootstrap/codegen.py's find_llc(), so a toolchain this accepts is a
      # toolchain the compiler can actually use.
      - name: Toolchain present
        run: |
          set -euo pipefail
          LLC=""
          for candidate in llc-22 llc-21 llc-20 llc-19 llc-18 llc-17 llc-16 llc-15 llc-14 llc; do
            if command -v "$candidate" >/dev/null 2>&1; then LLC="$candidate"; break; fi
          done
          if [ -z "$LLC" ]; then echo "no llc found on PATH"; exit 1; fi
          echo "llc: $LLC"
          "$LLC" --version | head -1
          CC=""
          for candidate in gcc clang cc; do
            if command -v "$candidate" >/dev/null 2>&1; then CC="$candidate"; break; fi
          done
          if [ -z "$CC" ]; then echo "no C compiler found on PATH"; exit 1; fi
          echo "cc: $CC"

      - name: Build the compiler
        run: |
          python tools/frayc_selfhosted.py build compiler/frayc.fray \
            -o build/frayc_driver --timeout 900

      - name: Build the runtime
        run: make -s -C runtime libfrayrt.a

      # FRAY_ALLOW_UNSIGNED=1 because a runner has no release signing key, and
      # signing with a key generated here would be worse than not signing: the
      # signature would carry an identity nobody can ever verify. The release
      # you publish is signed on a machine that holds the real key.
      - name: Package the release
        run: FRAY_ALLOW_UNSIGNED=1 bash tools/package_release.sh

      # The release criterion, run from inside the archive rather than from
      # the checkout: what ships has to compile and run a program on its own.
      - name: Run a program from the packaged archive
        run: |
          set -euo pipefail
          cd dist
          PKG=$(ls -d fray-*/ | head -1)
          PKG="${PKG%/}"
          # `unzip -d` creates the directory it is given; `tar -C` does not,
          # it only switches into it. Without this the Linux and macOS legs
          # died at extraction with "tar: verify: Cannot open", while the
          # Windows leg, which goes through unzip, carried on.
          mkdir -p verify
          if [ -f "$PKG.zip" ]; then
            unzip -q "$PKG.zip" -d verify
          else
            tar -xzf "$PKG.tar.gz" -C verify
          fi
          cd "verify/$PKG"
          echo "--- bin/ ---"
          ls bin/
          ./bin/fray run examples/hello.fray
          ./bin/fray run examples/fizzbuzz.fray | tail -3

      - name: Golden cases from the packaged archive
        run: |
          set -euo pipefail
          cd dist
          PKG=$(ls -d fray-*/ | head -1)
          PKG="${PKG%/}"
          mkdir -p verify2
          if [ -f "$PKG.zip" ]; then
            unzip -q "$PKG.zip" -d verify2
          else
            tar -xzf "$PKG.tar.gz" -C verify2
          fi
          cd "verify2/$PKG"
          bash tools/check_cases.sh

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: fray-${{ matrix.os }}
          # Windows packages as .zip and the others as .tar.gz, so glob both;
          # a .tar.gz-only pattern would fail the Windows leg on its own
          # artifact upload after the package itself built and ran fine.
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
